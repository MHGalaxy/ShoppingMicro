services:
  #CatalogDB 27017:27017
  catalogDb: 
    container_name: catalogdb
    restart: always
    ports:
      - "27017:27017"
    volumes:
      - "mongo_data:/data/db"  

  #Catalog.API 9000:8080
  catalog.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_URLS=http://+:8080 
      #- ASPNETCORE_HTTP_PORTS=8080
      #- ASPNETCORE_HTTPS_PORTS=8080

      - DatabaseSettings__ConnectionString=mongodb://catalogDb:27017?readPreference=primary&ssl=false
      - DatabaseSettings__DatabaseName=CatalogDb
      - DatabaseSettings__ProductsCollection=Products
      - DatabaseSettings__BrandsCollection=Brands
      - DatabaseSettings__TypesCollection=Types
    depends_on:
      - catalogdb
 
    ports:
      # 8080 : docker file
      # 9000 : local machine
      - "9000:8080"

  #BasketDB 6379:6379
  basketDb:
    container_name: basketdb
    restart: always
    ports:
      - "6379:6379"

  #Basket.API 9001:8080
  basket.api:
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ASPNETCORE_HTTP_PORTS=8080
      - ConnectionStrings__Redis=basketdb:6379

    depends_on:
      - basketdb

    ports:
      - "9001:8080"

